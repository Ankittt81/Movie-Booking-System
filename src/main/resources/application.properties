spring.application.name=MovieBooking

spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/BookMyShow
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql= true
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
booking.hold-minutes=5
app.seed.enabled=true
app.seed.password=Password@123
#12345

ai.base-url=https://api.groq.com/openai/v1
ai.api-key=${GROQ_API_KEY}
ai.model=openai/gpt-oss-20b
ai.max-tokens=1000
ai.temperature=0.2
ai.connect-timeout-ms=30000
ai.read-timeout-ms=30000
ai.max-retries=2
ai.backoff-ms=500





